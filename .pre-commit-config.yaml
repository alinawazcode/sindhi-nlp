# Runs the project's own pinned tools from your environment (pip install -e ".[dev]").
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]
